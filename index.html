<script>
/* ===== BUILD CONFIG (build.jsが書き換える。手動編集しない) ===== */
const EDITION = "lite";      // "full" | "lite"
const APP_VERSION = "1.10.2";
const STORE_URL = "https://shinme-lab.booth.pm/items/8654504";
const LITE = (EDITION === "lite");
const VER  = (APP_VERSION.indexOf("__")===0) ? "dev" : APP_VERSION;
const SHOP = (STORE_URL.indexOf("__")===0) ? "" : STORE_URL;
/* ライト版の制限 */
const LITE_PROFILES=2, LITE_MAXLV=3, LITE_HALF=4;  // Lv1〜3・各前半4面・なかま2人

/* ===== 学年帯(開始レベルのみ。まなびクエストから簡素化) ===== */
const GRADES={
 kinder:{label:'ようちえん', start:1, autoRead:true},
 g12:{label:'小1・小2', start:2, autoRead:false},
 g34:{label:'小3・小4', start:3, autoRead:false},
 g56:{label:'小5・小6', start:5, autoRead:false}
};
const THEMES=['adventure','ocean','pastel','forest','sunset'];
const THEME_LABEL={adventure:'🌌 よぞら',ocean:'🐬 なつのうみ',pastel:'🍓 ゆめかわ',forest:'🌲 みどりのもり',sunset:'🌇 ゆうやけ'};

/* ===== 保存層 ===== */
const SKEY='kk_state';
function uuid(){try{if(crypto&&crypto.randomUUID)return crypto.randomUUID();}catch(e){}return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);}
function today(){return new Date().toISOString().slice(0,10);}
function maxProfiles(){return LITE?LITE_PROFILES:12;}

let S=null;
function defState(){return {v:1, order:[], profiles:{}, pin:'1234', settings:{sound:true, read:true}, cur:null};}
function load(){
 try{const raw=localStorage.getItem(SKEY);if(raw){S=JSON.parse(raw);migrate();return;}}catch(e){}
 S=defState();
}
function touchProfile(p){if(p)p.up=Date.now();}
function save(){try{const p=curP();if(p&&!p.up)p.up=Date.now();localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}}
/* ============================================================
   かぞく同期(Supabase)— まなびクエストから移植。
   salt 'manabiquest-sync-v1' は【しんめ工房共通】。変えると同じあいことばでも
   別baseIdになりパスポートが繋がらない。絶対に変更しないこと。
   サーバー(mq_syncテーブル・mq_get/mq_put RPC)はまなびと共通で変更不要。
   ============================================================ */
const CLOUD_ITER=310000;
function b64u(bytes){let s='';for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function ub64u(str){const b=atob(str.replace(/-/g,'+').replace(/_/g,'/'));const out=new Uint8Array(b.length);for(let i=0;i<b.length;i++)out[i]=b.charCodeAt(i);return out;}
async function syncEncode(json){
 try{ if(typeof CompressionStream!=='undefined'){
  const stream=new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
  const buf=await new Response(stream).arrayBuffer();
  return 'g'+b64u(new Uint8Array(buf));
 } }catch(e){}
 return 'p'+b64u(new TextEncoder().encode(json));
}
async function syncDecode(payload){
 const mode=payload[0],body=payload.slice(1);
 const bytes=ub64u(body);
 if(mode==='g'){
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
 }
 return new TextDecoder().decode(bytes);
}
/* あいことば → PBKDF2(31万回) → 512bit。前半=AES-GCM鍵 / 後半=baseId。
   salt はしんめ工房共通(§0.1)。ゼロ知識: サーバーは平文を一切見ない。 */
async function kdf(pass){
 const enc=new TextEncoder();
 const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits(
  {name:'PBKDF2',salt:enc.encode('manabiquest-sync-v1'),iterations:CLOUD_ITER,hash:'SHA-256'},km,512);
 const by=new Uint8Array(bits);
 const key=await crypto.subtle.importKey('raw',by.slice(0,32),'AES-GCM',false,['encrypt','decrypt']);
 return {key,id:b64u(by.slice(32))};
}
async function cloudEncrypt(json,key){
 const inner=await syncEncode(json);
 const iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(inner)));
 const out=new Uint8Array(12+ct.length);out.set(iv,0);out.set(ct,12);
 return b64u(out);
}
async function cloudDecrypt(payload,key){
 const by=ub64u(payload);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:by.slice(0,12)},key,by.slice(12));
 return await syncDecode(new TextDecoder().decode(new Uint8Array(pt)));
}
function rpcRow(res){
 if(!res)return null;
 if(Array.isArray(res))return res.length?res[0]:null;
 return res;
}
/* 旧形式キー(eyJ…JWT)は apikey+Authorization 両方、新形式(sb_publishable_…)は apikey のみ */
async function cloudCall(fn,body){
 const hdr={'Content-Type':'application/json','apikey':S.cloud.key};
 if(S.cloud.key.indexOf('eyJ')===0)hdr['Authorization']='Bearer '+S.cloud.key;
 const r=await fetch(S.cloud.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{
  method:'POST',headers:hdr,body:JSON.stringify(body)});
 if(!r.ok)throw new Error('server '+r.status);
 const t=await r.text();
 return t?JSON.parse(t):null;
}
/* 1行を読む(復号済みJSON or null)。keyは呼び出し側で導出済みを渡す */
async function cloudReadRow(rowId,key){
 const row=rpcRow(await cloudCall('mq_get',{p_id:rowId}));
 if(!row||!row.blob)return null;
 try{ return JSON.parse(await cloudDecrypt(row.blob,key)); }catch(e){ return null; }
}
/* 1行を書く(JSONを暗号化してput) */
async function cloudWriteRow(rowId,obj,key){
 const blob=await cloudEncrypt(JSON.stringify(obj),key);
 await cloudCall('mq_put',{p_id:rowId,p_blob:blob});
}
/* ===== からくり固有の同期ロジック ===== */
/* baseId をあいことばから導出(保存されたpassを使う)。{key,id} を返す */
async function cloudKeys(){
 if(!S.cloud||!S.cloud.pass)throw new Error('あいことばが ありません');
 return await kdf(S.cloud.pass);
}
/* プロフィール単位マージ(karakuri-sync-spec §3)。
   stages: c/p/k=OR, b=min。level=max。coins等はupが新しい側。未知キー保持。 */
function mergeProfile(local,remote){
 if(!remote)return local;
 if(!local)return remote;
 const out=Object.assign({},local);   // 未知キーはlocal優先で保持
 // stages 合流
 const stages={};
 const ids=new Set([...Object.keys(local.stages||{}),...Object.keys(remote.stages||{})]);
 for(const id of ids){
  const a=(local.stages||{})[id]||{}, b=(remote.stages||{})[id]||{};
  const m={};
  m.clear=!!(a.clear||b.clear); m.pit=!!(a.pit||b.pit); m.kara=!!(a.kara||b.kara);   // OR
  const ab=a.best, bb=b.best;
  if(ab!=null&&bb!=null)m.best=Math.min(ab,bb);           // 自己ベスト=min
  else if(ab!=null)m.best=ab; else if(bb!=null)m.best=bb;
  // 未知のstageキーも保持
  for(const k in a)if(!(k in m))m[k]=a[k];
  for(const k in b)if(!(k in m))m[k]=b[k];
  stages[id]=m;
 }
 out.stages=stages;
 out.level=Math.max(local.level||1, remote.level||1);      // level=max
 // coins/coinCap/name/theme/avatar/grade/coinsToday等は up が新しい側を採用
 const newer=(remote.up||0)>(local.up||0)?remote:local;
 ['coins','coinCap','coinsDate','coinsToday','name','theme','avatar','grade','lock','placed'].forEach(k=>{
  if(k in newer)out[k]=newer[k];
 });
 // collection(ずかん)は max 合流(grow-only)。実データ形式 {n:count} を保つ
 const col={};
 const ck=new Set([...Object.keys(local.collection||{}),...Object.keys(remote.collection||{})]);
 for(const k of ck){
  const m=Math.max(colN((local.collection||{})[k]), colN((remote.collection||{})[k]));
  if(m>0)col[k]={n:m};
 }
 out.collection=col;
 out.up=Math.max(local.up||0, remote.up||0);
 // seen(解禁説明)は OR 合流
 const seen=Object.assign({},local.seen||{},remote.seen||{});
 out.seen=seen;
 return out;
}
/* pull: クラウドから読んでローカルへ合流 */
async function cloudPull(){
 const {key,id}=await cloudKeys();
 // 1) passport
 const passport=await cloudReadRow(id+':passport',key);
 if(passport&&passport.profiles){
  for(const uuid in passport.profiles){
   if(S.profiles[uuid]){
    const pp=passport.profiles[uuid];
    // 基本情報のみ反映(行後勝ち)。進捗はkarakuri行が持つ
    ['name','avatar','theme','grade'].forEach(k=>{if(k in pp)S.profiles[uuid][k]=pp[k];});
   }
  }
  if(passport.lock)Object.values(S.profiles).forEach(p=>{p.lock=passport.lock;});
 }
 // 2) karakuri(プロフィール単位マージ)
 const remote=await cloudReadRow(id+':karakuri',key);
 if(remote&&remote.profiles){
  for(const uuid in remote.profiles){
   if(S.profiles[uuid])S.profiles[uuid]=mergeProfile(S.profiles[uuid],remote.profiles[uuid]);
   else { // リモートのみ: 上限内なら取り込む
    if(S.order.length<maxProfiles()){S.profiles[uuid]=remote.profiles[uuid];S.order.push(uuid);}
   }
  }
 }
 // 3) collection の karakuri区画を max 合流
 const col=await cloudReadRow(id+':collection',key);
 if(col&&col.apps&&col.apps.karakuri){
  for(const uuid in col.apps.karakuri){
   if(S.profiles[uuid]){
    const remoteCol=col.apps.karakuri[uuid]||{};
    const lc=S.profiles[uuid].collection||{};
    const merged=Object.assign({},lc);
    for(const k in remoteCol){const n=Math.max(colN(merged[k]),colN(remoteCol[k]));if(n>0)merged[k]={n:n};}
    S.profiles[uuid].collection=merged;
   }
  }
 }
 save();
}
/* push: ローカルを読み込み済みリモートと合成して書く */
async function cloudPush(){
 const {key,id}=await cloudKeys();
 // 1) passport: リモートを読み、自分のプロフィール基本情報を反映(行後勝ち)
 let passport=await cloudReadRow(id+':passport',key)||{profiles:{},apps:{}};
 if(!passport.profiles)passport.profiles={};
 if(!passport.apps)passport.apps={};
 for(const uuid of S.order){
  const p=S.profiles[uuid];
  passport.profiles[uuid]=Object.assign(passport.profiles[uuid]||{},
   {name:p.name,avatar:p.avatar,theme:p.theme,grade:p.grade});
 }
 passport.apps.karakuri={v:APP_VERSION,last:today()};
 await cloudWriteRow(id+':passport',passport,key);
 // 2) karakuri: リモートを読み、プロフィール単位マージして書く
 let remote=await cloudReadRow(id+':karakuri',key)||{profiles:{}};
 if(!remote.profiles)remote.profiles={};
 const outProfiles={};
 const allU=new Set([...S.order,...Object.keys(remote.profiles)]);
 for(const uuid of allU){
  const local=S.profiles[uuid];
  const rem=remote.profiles[uuid];
  outProfiles[uuid]=mergeProfile(local,rem);
 }
 await cloudWriteRow(id+':karakuri',{profiles:outProfiles},key);
 // 3) collection: karakuri区画だけ更新、他区画は round-trip 保持
 let col=await cloudReadRow(id+':collection',key)||{apps:{}};
 if(!col.apps)col.apps={};
 const kcol=col.apps.karakuri||{};
 for(const uuid of S.order){
  const lc=S.profiles[uuid].collection||{};
  const rc=kcol[uuid]||{};
  const merged=Object.assign({},rc);
  for(const k in lc){const n=Math.max(colN(merged[k]),colN(lc[k]));if(n>0)merged[k]=n;}
  kcol[uuid]=merged;
 }
 col.apps.karakuri=kcol;
 await cloudWriteRow(id+':collection',col,key);
 S.cloud.lastSync=Date.now();save();
}


function migrate(){
 if(!S.v)S.v=1;
 if(!S.settings)S.settings={sound:true,read:true};
 if(!S.pin)S.pin='1234';
 if(!S.order)S.order=[];
 if(!S.profiles)S.profiles={};
 Object.values(S.profiles).forEach(q=>{if(!q.seen)q.seen={};if(!q.up)q.up=Date.now();});
 if(!S.cloud)S.cloud=null;
}
function newProfile(name,avatar,theme,grade){
 return {id:uuid(), name:name||'モコ', avatar:avatar||'🦖', theme:theme||'adventure',
  grade:grade||'g34', lock:null,
  level:LITE?1:(GRADES[grade]||GRADES.g34).start,   // ライトは全員Lv1(§7)
  stages:{}, coins:0, coinsDate:'', coinsToday:0, coinCap:null, collection:{},
  placed:false, seen:{}, up:Date.now()};   // up: プロフィール最終更新(同期マージ判定用)
}
function curP(){return S.cur?S.profiles[S.cur]:null;}
/* ずかんの1体分の獲得数。実データは {n:count} 形式(旧・数値も許容)。
   同期・パスポートのクラウド行には数値で書く(パスポート仕様§2.5・まなびと同形式)。 */
function colN(v){return typeof v==='number'?v:((v&&v.n)||0);}
/* かぞくのからくり塔(骨格§6): 家族合算のクリア数+ぴったり数から導出。
   保存しない=同期マージが正しい限り塔は常に正しい(壊れようがない)。 */
function towerStats(){
 let clears=0,pits=0;
 S.order.forEach(id=>{const q=S.profiles[id];
  Object.values(q.stages||{}).forEach(x=>{if(x.clear)clears++;if(x.pit)pits++;});});
 const points=clears+pits;
 const dan=Math.min(10, Math.floor(points/12)+1);
 const next=dan<10 ? (dan*12)-points : 0;   // つぎの だんまでの残りポイント
 return {clears,pits,points,dan,next};
}
/* 🔁解禁は level>=3 から導出(保存しない・二重管理しない) */
function repUnlockedFor(p){return p && p.level>=3;}

/* ===== コイン(1日上限・effCap思想) ===== */
function coinCapOf(p){return p.coinCap==null?60:p.coinCap;}  // null=60。0以下は「せいげんなし」表現用に -1 を使う
function isUnlimited(p){return p.coinCap===-1;}
function addCoins(p,n){
 const t=today();
 if(p.coinsDate!==t){p.coinsDate=t;p.coinsToday=0;}
 let give=n;
 if(!isUnlimited(p)){
  const room=Math.max(0, coinCapOf(p)-p.coinsToday);
  give=Math.min(n,room);
 }
 p.coins+=give; p.coinsToday+=give;
 return give;
}

/* 最短経路(ヒント用): 未回収の最寄り宝箱への最短路 */
function bfsPath(st,from,targets){

  const [x,y]=q.shift();
  if(goals.some(g=>g[0]===x&&g[1]===y)){
   const dirs=[];let k=key(x,y);
   while(prev[k]){dirs.unshift(prev[k].d);k=prev[k].k;}
   return dirs;
  }
  for(const d of Object.keys(DIRS)){
   const r=stepPos(p,x,y,d);
   if(r.ev)continue;
   const nk=key(r.x,r.y);

/* 全宝箱を回る最短手数(順序自由・宝箱は少数前提の全順列) */
function solvable(st){

 let best=-1;
 for(const order of perms(chests.map((_,i)=>i))){
  let cur=st.start,total=0,ok=true;
  for(const idx of order){
   const d=bfsPath(st,cur,[chests[idx]]);
   if(!d.length&&!(cur[0]===chests[idx][0]&&cur[1]===chests[idx][1])){ok=false;break;}
   total+=d.length;cur=chests[idx];
  }

/* ================= れんしゅうの原っぱ(karakuri-harappa-spec) =================
   原則: 解パスを先に引き、あとから飾る。生成後 solvable() で機械検証。

const HARA={stage:null,best:null,lastSig:''};
function hrnd(n){return Math.floor(Math.random()*n);}

/* moves列 → ステージ(盤=バウンディングボックス+海1縁)。opts: chests,flowers,branches,rocks */
function hboard(lv,moves,opts){

/* ランダムなモチーフ(長さlen・後戻りなし) */
function hmotif(len){

   const fam=hrnd(5);
   let aDir,aLen,bDir,bLen;
   if(fam===0){aDir='R';aLen=2+hrnd(2);bDir='D';bLen=1;}        // 横階段 R×2-3+D
   else if(fam===1){aDir='D';aLen=2+hrnd(2);bDir='R';bLen=1;}   // 縦階段 D×2-3+R
   else if(fam===2){aDir='R';aLen=4+hrnd(2);bDir='D';bLen=1;}   // 大股 R×4-5+D
   else if(fam===3){aDir='D';aLen=4+hrnd(2);bDir='R';bLen=1;}   // 縦大股 D×4-5+R
   else {aDir='R';aLen=2+hrnd(3);bDir='D';bLen=2;}              // 桝 R×2-4+D×2
   const k=2+hrnd(3);
   const unit=[];for(let q=0;q<aLen;q++)unit.push(aDir);
   for(let q=0;q<bLen;q++)unit.push(bDir);
   let mv=[];for(let i=0;i<k;i++)mv=mv.concat(unit);
   if(mv.length>20)continue;
   st=hboard(6,mv,{rocks:hrnd(3)});
  }else{
   // Lv7〜8: 本編と同じ「拠点」型。本道を進み、拠点で潜って宝を取り、また戻る。
   // 同じ動きの繰り返しなので ⭐わざを作って呼ぶのが自然な解になる。
   // Lv8は深さを2種類まぜる(あさい/ふかい)=わざ2本の出番。
   // ※往復で経路が重なるため hwalk は使えない(自己交差扱い)。Lv5と同じく盤を直接組む。
   const W=6+hrnd(5);                   // 本道 6〜10
   const nB=3+hrnd(2);                  // 拠点 3〜4本
   const twoDepth=(lv>=8);
   const up=hrnd(2)===1;                // 上に登る型 / 下に潜る型
   const digD=up?'U':'D', backD=up?'D':'U';
   const xs=[];let guard=0;
   while(xs.length<nB&&guard<30){guard++;
    const x=1+hrnd(W-1);
    if(!xs.some(v=>Math.abs(v-x)<2))xs.push(x);
   }
   if(xs.length<2)continue;
   xs.sort((a,b)=>a-b);
   const mv=[];const branchCells=[];const chests=[];
   let bi=0;
   for(let x=1;x<=W;x++){
    mv.push('R');
    if(xs.includes(x)){
     const depth=twoDepth?(bi%2===0?2:3):2; bi++;
     const bc=[];
     for(let d=1;d<=depth;d++){mv.push(digD);bc.push([x,up?-d:d]);}
     for(let d=depth;d>=1;d--)mv.push(backD);
     branchCells.push(bc);
     chests.push([x,up?-depth:depth]);
    }
   }
   if(!chests.length||mv.length>34)continue;
   // 盤を直接組む(本道 y=0 + 脇道)。上に伸びる型は y が負になるので下駄をはかせる
   const mainCells=[];for(let x=0;x<=W;x++)mainCells.push([x,0]);
   let all=mainCells.slice();branchCells.forEach(bc=>all=all.concat(bc));
   const miny=Math.min.apply(null,all.map(c=>c[1]));
   const off=1-miny;                    // y=miny を 1 に合わせる
   const land=new Map();
   all.forEach(c=>land.set((c[0]+1)+','+(c[1]+off)+'','g'));
   const maxy=Math.max.apply(null,all.map(c=>c[1]));
   const w=W+3, h=(maxy+off)+2;
   const grid=[];
   for(let yy=0;yy<h;yy++){const row=[];
    for(let xx=0;xx<w;xx++)row.push(land.get(xx+','+yy)||'s');
    grid.push(row.join(' '));}
   st={id:'はらっぱ',lv:lv,name:'れんしゅうの はらっぱ',harappa:true,
    hint:'おなじ うごきは ⭐わざに まとめると らくだよ',grid:grid,start:[1,0+off],
    chests:chests.map(c=>[c[0]+1,c[1]+off]),sol:mv};
  }
  if(!st)continue;
  // 盤サイズ上限(本編最大と同じ16×16。スマホで潰れない)
  {const pp=parseStage(st);if(pp.w>16||pp.h>16)continue;}
  // 同一構造の連続を避ける
  const sig=lv+':'+st.sol.join('');
  if(sig===HARA.lastSig)continue;
  // 機械検証: 必ず解ける
  if(solvable(st)<0)continue;
  HARA.lastSig=sig;
  return st;
 }
 // 上限到達: 絶対安全な直線にフォールバック(無限ループしない)
 const st=hboard(lv,['R','R'],{});HARA.lastSig=lv+':RR';return st;
}

const RE_EMOJI=/[\u{1F000}-\u{1FAFF}\u{2190}-\u{21FF}\u{2300}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}]/gu;
function stripTags(t){return String(t).replace(/<br\s*\/?>/gi,' ').replace(/<[^>]*>/g,'').replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&');}
function sayText(t){return stripTags(t).replace(RE_EMOJI,'').replace(/[◯✕«»「」]/g,' ').replace(/\s+/g,' ').trim();}
function speak(txt){
 if(!S.settings.read)return;
 try{const u=new SpeechSynthesisUtterance(txt);u.lang='ja-JP';u.rate=.95;
  speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}

 // §2.2 かぞくのパスポート
 h+='<div class="psec"><div class="reglbl">☁️ かぞくの パスポート</div>';

  h+='<div class="ppsub">かぞくの なかま</div>';

  }
 }else h+='<div class="mut sm">まだ かぞくの なかまが とうろく されていないよ。</div>';
 // あしあと
 if(passport&&passport.apps&&Object.keys(passport.apps).length){

  for(const k in passport.apps){

   h+='<div class="ppRow"><span class="ppName">'+esc(appLabel(k))+'</span>'
    +(a.last?'<span class="ppStat">さいごに あそんだ日: '+esc(String(a.last))+'</span>':'')+'</div>';

 }
 h+='</div>';
 // §2.3 しんめコレクション
 h+='<div class="psec"><div class="reglbl">🌟 しんめ コレクション</div>';
 const apps=(collection&&collection.apps)||{};
 const appKeys=Object.keys(apps);
 if(!appKeys.length)h+='<div class="mut sm">まだ あつめたものが ないよ。</div>';
 for(const ak of appKeys){
  const region=apps[ak]||{};
  if(ak==='karakuri'){

   const gotSet={};
   for(const uuid in region){const cc=region[uuid]||{};for(const cid in cc)if(colN(cc[cid])>0)gotSet[cid]=true;}
   const ids=Object.keys(gotSet);
   h+='<div class="ppsub">からくり工房 <span class="mut">'+ids.length+'/'+KARA_CHARS.length+'たい</span></div>';
   h+='<div class="ppChars">';
   KARA_CHARS.forEach(c=>{h+='<span class="ppChar'+(gotSet[c.id]?'':' lk')+'">'+(gotSet[c.id]?c.e:'❔')+'</span>';});
   h+='</div>';
  }else{
   // 他アプリ区画: 数のみ(中身を推測しない)
   let n=0;
   for(const uuid in region){const cc=region[uuid]||{};n+=Object.keys(cc).filter(cid=>colN(cc[cid])>0).length;}
   h+='<div class="ppsub">'+esc(appLabel(ak))+' <span class="mut">'+n+'たい あつめたよ</span></div>';
   h+='<div class="mut sm">くわしくは '+esc(appLabel(ak))+'で みてね。</div>';

 }
 h+='</div>';
 return h;
}

    +'<div class="mut sm">☁️ いま つながらないみたい。でんぱの あるところで もういちど ひらいてね。</div></div>';

 }

 // 2倍速(Lv6解禁)。設定は curP に持たず、実行ごとにトグル状態を見る
 const dur = (fastUnlocked() && fastOn) ? 180 : 360;
 const clearHi=()=>{};   // インタープリタ化でソース対応の複雑な演出は廃止(path が正)
 // path[0]=開始位置なので1から

   SFX.bump();moko.classList.add('bump');fx('ごっつん!',res.path[i-1].x,res.path[i-1].y);

  {const prev=res.path[i-1];const pl=prev&&prev.lap;

   }}
  moko.style.left=(p.x*cellPx)+'px';moko.style.top=(p.y*cellPx)+'px';
  moko.classList.add('hop');SFX.step();
  if(p.ev!=='sea')visited.push({x:p.x,y:p.y});
  await sleep(dur);moko.classList.remove('hop');
  if(p.got!==null&&p.got!==undefined){
   const ce=$('chest'+p.got);
   if(ce){ce.innerHTML=CHEST_OPEN;ce.classList.add('open');SFX.tap();}
  }
  if(p.ev==='sea'){
   SFX.splash();moko.classList.add('splash');fx('ぽちゃん!',p.x,p.y);
   await sleep(750);
   msg('うみに ぽちゃん! もういちど やってみよう',true);
   break;
  }
 }
 clearHi();
 if(res.ok){
  chestList(st).forEach((c,i)=>{const e=$('chest'+i);if(e){e.innerHTML=CHEST_OPEN;e.classList.add('open');}});
  moko.classList.add('cheer');SFX.clear();
  await sleep(900);
  showClear(res,st);
 }else{
  // 失敗: モコをスタートへ戻す(プログラムは残す=直して再挑戦)
  await sleep(400);
  moko.classList.remove('splash');
  moko.style.left=(P.start[0]*cellPx)+'px';moko.style.top=(P.start[1]*cellPx)+'px';
  clearHi();
  if(res.reason==='short')msg('あと すこし! ブロックを たしてみよう',true);
  else if(res.reason==='toolong')msg('ながすぎて モコが くたびれちゃう!',true);
  else if(res.reason==='toomany')msg('ここでは つかえる ブロックが すくないよ! もっと みじかく',true);
  // あしあと: どこまで あるけたかを 残す
  showFootprints(visited);
  // ヒントのはしご: 3回で最初の2手、5回で道あかり
  fails[cur]=(fails[cur]||0)+1;
  if(fails[cur]>=5)glowPath(st);
  else if(fails[cur]>=3)showGhost(st);
 }
 running=false;$('btnRun').disabled=prog.length===0;
 drawProg();   // 実行終了でパレットの🔁/❓無効化を解除(runningを見て再判定)
}
/* 原っぱのクリア: コイン2(上限内数)・自己ベスト表示のみ・進捗/塔に影響しない(仕様§4) */
function showHarappaClear(res,st){
 const p=curP();
 HARA.best=HARA.best==null?res.blocks:Math.min(HARA.best,res.blocks);
 const got=addCoins(p,2);
 save();   // コインだけ保存(stages には書かない)
 SFX.clear();
 $('ovl').innerHTML='<div class="overlay"><div class="rcard">'
  +'<div style="font-size:2rem">🌼</div>'
  +'<h2>クリア!</h2>'
  +'<div class="sub">つかったブロック: '+res.blocks+'こ</div>'
  +'<div class="pit" style="display:block;margin:8px auto;max-width:fit-content">じこベスト: '+HARA.best+'こ</div>'
  +(got>0?'<div class="sub">🪙 +'+got+'</div>':'<div class="sub mut">きょうの コインは まんたん</div>')
  +'<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px">'
  +'<button class="btn ghost" onclick="$(\'ovl\').innerHTML=\'\';go(\'home\')">ホームへ</button>'
  +'<button class="btn" onclick="nextHarappa()">🌼 つぎの はらっぱ</button>'
  +'</div></div></div>';
}
function showClear(res,st){
 if(st.harappa){showHarappaClear(res,st);return;}
 /* 仕様§3.1: 判定は <=(以下)。parR は provePar が下限を証明しているため
    「下回る解」は存在せず、<= にしても抜け道は生まれない。 */
 const pit=res.blocks<=st.par;
 const kara=repUnlocked()&&st.parR&&res.blocks<=st.parR;
 const p=curP();
 // 進捗を記録(初回判定のためにクリア前の状態を退避)
 const prev=p.stages[st.id]||{};
 const firstClear=!prev.clear, firstPit=pit&&!prev.pit, firstKara=kara&&!prev.kara;
 const rec=p.stages[st.id]={
  clear:true,
  best:Math.min(prev.best||99, res.blocks),
  pit:prev.pit||pit, kara:prev.kara||kara
 };
 // コイン: 初回クリア10 / ぴったり初回+5 / からくり初回+5 / 再クリア2
 let gain=0;
 if(firstClear)gain+=10; else gain+=2;
 if(firstPit)gain+=5;
 if(firstKara)gain+=5;
 const got=addCoins(p,gain);
 playStreak++;
 // レベル解禁: そのレベルの8面すべて clear で次レベル解放
 const lv=st.lv;
 const lvStages=STAGES.filter(x=>x.lv===lv&&!x.harappa);
 let leveledTo=0;
 const MAX_LV=Math.max.apply(null,STAGES.map(s=>s.lv));
 if(lvStages.every(x=>p.stages[x.id]&&p.stages[x.id].clear) && p.level===lv && lv<MAX_LV){
  p.level=lv+1; leveledTo=p.level;
 }
 save();
 const idx=STAGES.findIndex(x=>x.id===st.id);
 const last=idx===STAGES.length-1 || !isStagePlayable(idx+1);
 $('ovl').innerHTML='<div class="overlay"><div class="rcard">'
  +'<h2>クリア!</h2>'
  +'<div class="stars">'+(pit?'⭐⭐⭐':'⭐⭐')+(kara?' ⚙️':'')+'</div>'
  +(kara?'<div class="pit kara">⚙️ からくりしょう! '+res.blocks+'こ</div>':'')
  +(pit?'<div class="pit">✨ ぴったりしょう! '+res.blocks+'こ</div>'
       :'<div class="sub">つかったブロック: '+res.blocks+'こ(ぴったりは '+st.par+'こ)</div>')
  +'<div class="sub">'+(
     kara?'くりかえしを つかって、とことん みじかく できた!'
     :(pit&&repUnlocked()&&st.parR?'🔁を つかうと、あと'+(st.par-st.parR)+'こ みじかく できるよ!'
     :(pit?'いちばん すくない ブロックで うごかせた!'
          :'ぴったりに ちょうせん しても いいし、つぎに すすんでも いいよ')))+'</div>'
  +'<div class="coinGot">🪙 +'+got+(got<gain?'(きょうは ここまで)':'')+'</div>'
  +'<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'
  +'<button class="btn ghost" onclick="againStage()">もういちど</button>'
  +'<button class="btn ghost" onclick="toMap()">マップへ</button>'
  +(leveledTo?'<button class="btn" onclick="showLevelUp('+leveledTo+')">つぎへ ▶</button>'
    :(last?'':'<button class="btn" onclick="nextStage()">つぎへ ▶</button>'))
  +'</div></div></div>';
}

/* ===== レベルアップ演出 + 新ブロック解禁の説明(rep/if/star 共通) ===== */
const UNLOCKS={
 3:{key:'rep', icon:'🔁', title:'くりかえし ブロック', lines:[
   '🔁の あとに ブロックを いれると、その ぶんだけ くりかえすよ!',
   'かいすうは 🔁を タップして かえられる(2〜5かい)。',
   '🔁の うしろにも ブロックは おけるよ。',
   'ちゅうい: 🔁の なかに 🔁は いれられないよ!']},
 5:{key:'if', icon:'❓', title:'もし ブロック', lines:[
   '❓の あとに ブロックを いれると、はなの マスに いるときだけ うごくよ!',
   '❓は 🔁の なかにも いれられる。まわるたびに かわる うごきが つくれるよ。']},
 7:{key:'star', icon:'⭐', title:'わざ ブロック', lines:[
   '⭐は じぶんだけの「わざ」に なまえを つけて、なんども よべる ブロック!',
   'した の「⭐きんの わざ」を タップして、なかみ(やじるしや🔁)を つくってね。',
   'メインで ⭐を おすと、その わざを よびだせるよ。',
   'おなじ うごきが とびとびに でてくる ときに つかうと みじかく できる!']}
};
window.showLevelUp=(lv)=>{
 SFX.clear();
 $('ovl').innerHTML='<div class="overlay"><div class="rcard">'
  +'<div class="lvupBadge">Lv'+lv+'</div>'
  +'<h2>おめでとう!</h2>'
  +'<div class="pit" style="display:block;margin:8px auto 4px;max-width:fit-content">レベル'+(lv-1)+' クリア!</div>'
  +'<p class="sub">つぎは レベル'+lv+' だよ</p>'
  +'<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px">'
  +'<button class="btn ghost" onclick="toMap()">マップへ</button>'
  +'<button class="btn" onclick="afterLevelUp('+lv+')">つぎの レベルへ ▶</button>'
  +'</div></div></div>';
};
window.afterLevelUp=(lv)=>{
 const p=curP();const u=UNLOCKS[lv];
 if(u && p && !(p.seen&&p.seen[u.key])){ showUnlock(lv); return; }
 nextStage();
};
window.showUnlock=(lv)=>{
 const u=UNLOCKS[lv];const p=curP();
 if(p){ if(!p.seen)p.seen={}; p.seen[u.key]=true; save(); }
 SFX.gacha();
 // この新ブロックで、これまでのマップの面ももっと短くできるかも(復習動線)。
 // backLv = 新ブロックが活きる「これまでの」レベル帯の入口(戻り先)。
 const backLv = lv-1;   // 🔁解禁(lv3)→Lv2 / ❓(lv5)→Lv4 / ⭐(lv7)→Lv6 …これまで遊んだ面へ
 $('ovl').innerHTML='<div class="overlay"><div class="rcard">'
  +'<div class="unlockIcon">'+u.icon+'</div>'
  +'<h2>あたらしい ブロック!</h2>'
  +'<div class="pit" style="display:block;margin:8px auto 10px;max-width:fit-content">'+u.title+'</div>'
  +'<div class="unlockBody">'+u.lines.map(l=>'<p>'+l+'</p>').join('')+'</div>'
  +'<div class="reviewNote">💡 いままでの マップでも、'+u.icon+'を つかうと もっと はやく できる めんが あるかも!</div>'
  +(lv===3?'<div class="reviewNote gold">⚙️ <b>からくりしょう</b>は Lv1〜Lv2の めんに かくれているよ。'
    +'マップで <b>きんいろに ひかっている めん</b>が ねらいめ!</div>':'')
  +'<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px">'
  +'<button class="btn ghost" onclick="reviewMap('+backLv+')">まえの マップを みる</button>'
  +'<button class="btn" onclick="nextStage()">やってみる!</button>'
  +'</div></div></div>';
};
/* 解禁説明から「まえの マップ」へ。指定レベルのマップを開く */
window.reviewMap=(lv)=>{$('ovl').innerHTML='';mapLv=Math.max(1,lv);go('map');};
/* 原っぱ開始: 生成→STAGES末尾スロットに置く→startStage。BASE_N=本編64面 */
const BASE_STAGE_N=STAGES.length;
window.startHarappa=(lv)=>{
 const st=hgen(lv);
 HARA.stage=st;HARA.best=null;
 if(STAGES.length===BASE_STAGE_N)STAGES.push(st);else STAGES[BASE_STAGE_N]=st;
 startStage(BASE_STAGE_N);
};
window.nextHarappa=()=>{$('ovl').innerHTML='';startHarappa(STAGES[cur].lv);};
window.nextStage=()=>{$('ovl').innerHTML='';const i=cur;if(isStagePlayable(i+1)&&!STAGES[i+1].harappa){cur=i+1;fails[cur]=0;drawStage();}else toMap();};
window.againStage=()=>{$('ovl').innerHTML='';drawStage();};
window.toMap=()=>{$('ovl').innerHTML='';
 // いま遊んでいた面の レベルの マップを ひらく(入る前のレベルには戻さない)
 if(STAGES[cur])mapLv=STAGES[cur].lv;
 go('map');};
$('btnUndo').onclick=()=>{
 if(running)return;
 if(openC&&openC.body.length){SFX.del();clearAssist();openC.body.pop();drawProg();return;}
 if(openC&&!openC.body.length){
  // openC が属するリストを探して取り除く(main/s1/s2 のどれか)
  SFX.del();clearAssist();
  for(const sid of ['main','s1','s2']){const L=listFor(sid);const i=L.indexOf(openC);if(i>=0){L.splice(i,1);break;}}
  openC=null;drawProg();return;
 }
 const L=listFor(activeStrip);
 if(!L.length)return;
 SFX.del();clearAssist();L.pop();drawProg();
};
$('btnClear').onclick=()=>{if(running)return;SFX.del();clearAssist();prog=[];skills={s1:[],s2:[]};openC=null;activeStrip='main';drawProg();};
$('btnRun').onclick=run;
// わざストリップのヘッダ: タップで挿入先を切り替え(アクティブが光る)
['1','2'].forEach(nn=>{const hd=$('wazaHd'+nn);if(hd)hd.onclick=()=>{
  if(running)return;SFX.tap();const sid='s'+nn;
  activeStrip=(activeStrip===sid)?'main':sid;   // もう一度押すとメインに戻る
  openC=null;drawProg();
  msg(activeStrip==='main'?'':'⭐わざの なかみを つくっています。やじるしや 🔁を いれてね');};});
// メインの じゅんばん見出しでもメインに戻れる
{const mh=document.querySelector('.progHd');if(mh)mh.onclick=()=>{if(running)return;if(activeStrip!=='main'){SFX.tap();activeStrip='main';openC=null;drawProg();}};}
{const fb=$('btnFast');if(fb)fb.onclick=()=>{if(running)return;fastOn=!fastOn;
  fb.textContent=fastOn?'⏩ はやおくり ON':'⏩ はやおくり';fb.classList.toggle('on',fastOn);};}
$('btnBackMap').onclick=()=>{if(!running){if(STAGES[cur]&&STAGES[cur].harappa)go('home');else go('map');}};

/* ================= ライト版のロック判定 ================= */
/* ライト版: Lv1〜3のみ・各レベル前半4面のみ */
function isStageAllowed(idx){
 if(idx<0||idx>=STAGES.length)return false;
 if(!LITE)return true;
 const st=STAGES[idx];
 if(st.lv>LITE_MAXLV)return false;
 const within=STAGES.filter(x=>x.lv===st.lv&&!x.harappa).indexOf(st);
 return within<LITE_HALF;   // 前半4面
}
/* 遊べる=解禁レベル内 かつ ライトで許可 */
function isStagePlayable(idx){
 if(idx<0||idx>=STAGES.length)return false;
 const p=curP();if(!p)return false;
 if(STAGES[idx].lv>p.level)return false;
 return isStageAllowed(idx);
}

/* ================= 画面ルーター ================= */
const SCREENS=['profiles','home','passport','map','parent','play'];
/* onclick属性(グローバルスコープで評価される)から呼ぶ関数を window に公開。
   これらは document-guard ブロック内のローカル定義なので、明示公開しないと
   ブラウザで "not defined" になりボタンが無反応になる。 */
function exposeGlobals(){
 window.$=$;
 window.go=go; window.startStage=startStage; window.renderMap=renderMap;
 window.openGacha=openGacha; window.showZukan=showZukan; window.doGacha=doGacha;
 window.showLevelUp=showLevelUp; window.afterLevelUp=afterLevelUp; window.showUnlock=showUnlock; window.reviewMap=reviewMap;
 window.showHarappaClear=showHarappaClear;
 window.renderPassport=renderPassport; window.refreshPassportCloud=refreshPassportCloud; window.charById=charById; window.passportCloudHtml=passportCloudHtml;
}
function go(name){
 SCREENS.forEach(n=>{const el=$('scr-'+n);if(el)el.hidden=(n!==name);});
 if(name==='profiles')renderProfiles();
 else if(name==='home')renderHome();
 else if(name==='passport')renderPassport();
 else if(name==='map')renderMap();
 else if(name==='parent')renderParent();
 // play は startStage() 経由で描画
 applyTheme();
}
/* ===== きせかえ(いろの へんこう) =====
   子ども自身が いつでも 変えられる。おうちのかたメニューからも 変えられる。 */
window.openKisekae=(fromParent,uuid)=>{
 const p=uuid?S.profiles[uuid]:curP(); if(!p)return;
 SFX.tap();
 let h='<div class="overlay"><div class="rcard">'
  +'<h2>🎨 きせかえ</h2>'
  +'<div class="mut" style="margin:4px 0 12px">'+esc(p.name)+' の いろを えらんでね</div>'
  +'<div class="thGrid">';
 THEMES.forEach(t=>{
  h+='<button class="thOpt'+(p.theme===t?' on':'')+'" data-th="'+t+'" '
   +'onclick="pickTheme(\''+t+'\','+(fromParent?'1':'0')+',\''+(uuid||'')+'\')">'
   +'<span class="thSwatch" data-theme="'+t+'"><i></i><i></i><i></i></span>'
   +'<span class="thName">'+(THEME_LABEL[t]||t)+'</span>'
   +(p.theme===t?'<span class="thNow">いま これ</span>':'')
   +'</button>';
 });
 h+='</div>';
 h+='<button class="btn" onclick="closeKisekae('+(fromParent?'1':'0')+')">とじる</button>';
 h+='</div></div>';
 $('ovl').innerHTML=h;
};
window.pickTheme=(t,fromParent,uuid)=>{
 const p=uuid?S.profiles[uuid]:curP(); if(!p)return;
 p.theme=t; touchProfile(p); save();
 SFX.tap();
 // すぐ見た目に反映(自分のプロフィールを変えたときだけ)
 if(!uuid || uuid===S.cur)document.body.dataset.theme=t;
 openKisekae(fromParent,uuid);   // 選択状態を出し直す
};
window.closeKisekae=(fromParent)=>{
 $('ovl').innerHTML='';
 if(fromParent)renderParent(); else renderHome();
};
/* バージョンと版種を画面のすみに出す(どの版を触っているか いつでも分かるように) */
function showVersionBadge(){
 const el=$('verBadge'); if(!el)return;
 // フル版は バージョンだけ / おためし版は 版種も出す
 el.textContent=LITE?('v'+APP_VERSION+' ・ おためし版'):('v'+APP_VERSION);
 el.className=LITE?'lite':'';
}
function applyTheme(){
 const p=curP();
 document.body.dataset.theme=p?p.theme:'adventure';
}

/* ================= プレイ開始 ================= */
function startStage(idx){
 if(!isStagePlayable(idx))return;
 cur=idx;fails[cur]=0;
 SCREENS.forEach(n=>{const el=$('scr-'+n);if(el)el.hidden=(n!=='play');});
 applyTheme();palette();drawStage();
 // kinder帯: 面の開始時に say を自動読み上げ
 const p=curP(),st=STAGES[idx];
 if(p&&GRADES[p.grade]&&GRADES[p.grade].autoRead&&S.settings.read&&st.say)speak(sayText(st.say));
}

/* ================= 起動 ================= */
load();
exposeGlobals();
showVersionBadge();
if(S.order.length===0)go('profiles');
else if(S.cur&&S.profiles[S.cur])go('home');
else go('profiles');
// 起動時pull(§2.2): 同期設定済みなら静かに最新を取り込む(失敗は無害・独立動作)
if(S.cloud&&S.cloud.pass){
 cloudPull().then(()=>{ if(!$('scr-map').hidden)renderMap(); else if(!$('scr-home').hidden)renderHome(); }).catch(()=>{});
}
window.addEventListener('resize',()=>{if(!$('scr-play').hidden&&!running)drawStage();});
}
</script>
